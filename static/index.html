<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --accent: #38bdf8;
        --accent-2: #818cf8;
        --text: #f8fafc;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 20px 45px rgba(2, 6, 23, 0.45);
      }
      .display {
        background: #020617;
        border-radius: 16px;
        padding: 16px;
        min-height: 96px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        margin-bottom: 16px;
      }
      .expression { color: var(--muted); font-size: 16px; min-height: 24px; }
      .result { font-size: 34px; font-weight: 700; word-break: break-all; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      button {
        border: 0;
        border-radius: 16px;
        padding: 16px;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        color: var(--text);
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(1px); }
      .secondary { background: #334155; }
      .wide { grid-column: span 2; }
      .status { margin-top: 12px; color: var(--muted); font-size: 13px; min-height: 18px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="display">
        <div class="expression" id="expression">0</div>
        <div class="result" id="result">0</div>
      </div>
      <div class="grid">
        <button class="secondary" data-action="clear">C</button>
        <button class="secondary" data-action="delete">⌫</button>
        <button class="secondary" data-action="percent">%</button>
        <button data-action="operator" data-value="/">÷</button>
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-action="operator" data-value="*">×</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-action="operator" data-value="-">−</button>
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-action="operator" data-value="+">+</button>
        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="wide" id="equals">=</button>
      </div>
      <div class="status" id="status">Ready</div>
    </div>

    <script>
      const expressionEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      const statusEl = document.getElementById('status');
      let expression = '';

      function updateDisplay(value, resultValue = '') {
        expressionEl.textContent = value || '0';
        resultEl.textContent = resultValue || '0';
      }

      function setStatus(message) {
        statusEl.textContent = message;
      }

      document.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const value = btn.dataset.value;
          const action = btn.dataset.action;

          if (action === 'clear') {
            expression = '';
            updateDisplay('0', '0');
            setStatus('Cleared');
            return;
          }

          if (action === 'delete') {
            expression = expression.slice(0, -1);
            updateDisplay(expression || '0', '0');
            setStatus('Deleted');
            return;
          }

          if (action === 'percent') {
            expression = expression ? `(${expression})/100` : '';
            updateDisplay(expression || '0', '0');
            setStatus('Percent mode');
            return;
          }

          if (action === 'operator') {
            expression += value;
            updateDisplay(expression, '0');
            return;
          }

          if (btn.id === 'equals') {
            try {
              const response = await fetch('/api/calc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expression })
              });
              const data = await response.json();
              if (!response.ok) throw new Error(data.detail || 'Calculation failed');
              expression = String(data.result);
              updateDisplay(expression, data.result);
              setStatus(data.result !== null ? 'Computed' : 'Error');
            } catch (error) {
              setStatus(error.message);
            }
            return;
          }

          expression += value;
          updateDisplay(expression, '0');
        });
      });
    </script>
  </body>
</html>
